name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
      - name: Verify the installed CLI and run tests
        run: |
          codex-latency-doctor --version
          python -m unittest discover -s tests -v
      - name: Run the skill from a standalone installation
        run: |
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          cp -R skills/codex-latency-doctor "$sandbox/installed skill"
          cmp LICENSE "$sandbox/installed skill/LICENSE"
          cd "$sandbox"
          mkdir codex-home
          installed_skill="$sandbox/installed skill/scripts/doctor.py"
          test "$(python -E -S -B "$installed_skill" --version)" = "$(codex-latency-doctor --version)"
          python -E -S -B "$installed_skill" --codex-home "$sandbox/codex-home" --json audit --hours 1 > skill.json
          codex-latency-doctor --codex-home "$sandbox/codex-home" --json audit --hours 1 > cli.json
          python -c 'import json; assert json.load(open("skill.json"))["config"] == json.load(open("cli.json"))["config"]'
